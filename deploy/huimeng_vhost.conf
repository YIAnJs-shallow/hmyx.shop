# 惠蒙优选 本地域名虚拟主机配置
# 用途：让浏览器输入「惠蒙优选」（域名编码 xn--4oq564b47zxtj）直接打开本商城
# 安装方法见 deploy/本地域名配置说明.md
<VirtualHost *:80>
    ServerName xn--4oq564b47zxtj
    ServerAlias www.xn--4oq564b47zxtj
    DocumentRoot "E:/e2/phpstudy/phpstudy_pro/WWW/my_project"
    FcgidInitialEnv PHPRC "E:/e2/phpstudy/phpstudy_pro/Extensions/php/php7.3.4nts"
    AddHandler fcgid-script .php
    FcgidWrapper "E:/e2/phpstudy/phpstudy_pro/Extensions/php/php7.3.4nts/php-cgi.exe" .php
  <Directory "E:/e2/phpstudy/phpstudy_pro/WWW/my_project">
      Options FollowSymLinks ExecCGI
      AllowOverride All
      Order allow,deny
      Allow from all
      Require all granted
      # 网站默认首页：先展示新人落地页，再是商城列表
      DirectoryIndex welcome.php index.php index.html
  </Directory>
</VirtualHost>
