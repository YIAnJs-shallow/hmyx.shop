# CI：语法检查 + 集成测试（MySQL8 服务容器，PHP 7.4 与 phpStudy 线上一致）
# 密钥处理：工作流内现场生成一次性 RSA 密钥对写入 Web 根外私有目录 secrets.php，
# 仅满足测试所需常量，不含任何真实凭据（符合 AGENTS.md 密钥规则）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: my_web_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: my_web_db
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, openssl, curl, mbstring
      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1'
      - name: 生成测试专用密钥并写入私有配置目录
        run: |
          # 与 config/db.php 的 project_private_config_dir() 对齐：basename 取当前目录名（本地为 my_project，CI 为仓库名）
          PRIVATE_DIR="$(dirname "$(dirname "$PWD")")/private/$(basename "$PWD")"
          mkdir -p "$PRIVATE_DIR"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/key.pem
          # 直接取 PEM 的 base64 体（不做 DER 往返：DER 转换会破坏 PKCS#8 结构，导致 openssl_pkey_get_private 报 wrong tag）
          PRIV="$(openssl pkey -in /tmp/key.pem | grep -v 'BEGIN\|END' | tr -d '\n\r')"
          PUB="$(openssl pkey -in /tmp/key.pem -pubout | grep -v 'BEGIN\|END' | tr -d '\n\r')"
          # fail-fast：提取异常（长度不足）立即报错退出，绝不把空/残缺密钥静默写入后续流程
          if [ -z "$PRIV" ] || [ ${#PRIV} -lt 800 ] || [ -z "$PUB" ]; then
            echo "::error::密钥提取异常 PRIV=${#PRIV} PUB=${#PUB}"
            openssl pkey -in /tmp/key.pem 2>&1 | head -5 || true
            exit 1
          fi
          cat > "$PRIVATE_DIR/secrets.php" <<EOF
          <?php
          define('ALIPAY_SANDBOX_APP_ID', 'ci-test-app');
          define('ALIPAY_GATEWAY', 'http://127.0.0.1:9/');
          define('ALIPAY_APP_PRIVATE_KEY', '$PRIV');
          define('ALIPAY_ALIPAY_PUBLIC_KEY', '$PUB');
          define('ADMIN_ALLOWED_IPS', '127.0.0.1,::1');
          EOF
          rm -f /tmp/key.pem
      - name: 初始化数据库结构
        run: php scripts/migrate.php
      - name: PHP 语法检查
        run: |
          FAIL=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null || { echo "语法错误: $f"; FAIL=1; }
          done < <(find . -path ./backup_ -prune -o -name '*.php' -print)
          exit $FAIL
      - name: 缓存 PHPStan PHAR
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: phpstan-phar-2.3.1
      - name: PHPStan 静态分析（等级以 phpstan.neon 为准）
        run: |
          mkdir -p /tmp/phpstan
          if [ ! -f /tmp/phpstan/phpstan.phar ]; then
            curl -sSL --fail -o /tmp/phpstan/phpstan.phar \
              https://github.com/phpstan/phpstan/releases/download/2.3.1/phpstan.phar
          fi
          php /tmp/phpstan/phpstan.phar analyse --no-progress --memory-limit=1G --error-format=github
      - name: 集成测试
        run: php tests/integration.php
